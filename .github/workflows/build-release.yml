name: Build ESP32-C6 Matter Thread Lock

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "===== GITHUB WORKSPACE ====="
          echo "$GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Build ESP32-C6 Matter firmware
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            espressif/esp-matter:release-v1.6 \
            bash /project/build_release.sh

      - name: Show generated firmware
        run: |
          echo "===== RELEASE ====="
          find release -maxdepth 2 -type f -print || true

          echo "===== BINARIES ====="
          find build -maxdepth 3 -type f -name "*.bin" -print || true

      - name: Upload Launchpad firmware
        uses: actions/upload-artifact@v4
        with:
          name: srex-c6-matter-thread-lock-launchpad
          path: release/
          if-no-files-found: error
