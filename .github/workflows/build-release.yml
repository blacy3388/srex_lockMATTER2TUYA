name: Build ESP32-C6 Matter Thread LockV2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "===== GITHUB WORKSPACE ====="
          echo "$GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Build ESP32-C6 Matter firmware
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            espressif/esp-matter:latest \
            bash -lc '
              echo "===== ESP-MATTER ENVIRONMENT ====="
              echo "IDF_PATH=$IDF_PATH"
              echo "ESP_MATTER_PATH=$ESP_MATTER_PATH"

              echo "===== SWITCH TO OUR PROJECT ====="
              cd /project
              pwd
              ls -la

              echo "===== BUILD ====="
              bash /project/build_release.sh
            '

      - name: Show generated firmware
        run: |
          echo "===== RELEASE ====="
          find release -maxdepth 2 -type f -print || true

          echo "===== BINARIES ====="
          find build -maxdepth 3 -type f -name "*.bin" -print || true

      - name: Upload Launchpad firmware
        uses: actions/upload-artifact@v4
        with:
          name: srex-c6-matter-thread-lock-launchpad
          path: release/
          if-no-files-found: error
